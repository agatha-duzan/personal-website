	<!-- Mobile navigation fix -->
	<style>
		@media (max-width: 1024px) {
			#fh5co-portfolio,
			#fh5co-blog,
			#fh5co-contact,
			#fh5co-started,
			.fh5co-content-section {
				padding-top: 120px !important;
			}
			h2.cool-font {
				font-size: 5.6rem !important;
			}
		}

		@media (min-width: 768px) {
			.fh5co-nav-toggle {
				display: none !important;
			}
			.fh5co-nav .menu-1 {
				display: block !important;
			}
		}

		/* Logo hover effect */
		#fh5co-logo img {
			content: url('images/logo_agatha.jpg');
			transition: filter 1s ease;
		}
		#fh5co-logo img:hover {
			content: url('images/logo_agatha_pink.jpg');
		}

		/* Post layout */
		/* Title and headings inherit the site font and regular weight
		   from css/style.css h1-h6; size matches .fh5co-heading h2 (40px) */
		.blog-post .post-title {
			font-size: 40px;
			line-height: 1.3;
			margin-top: 20px;
			margin-bottom: 10px;
		}
		@media (max-width: 768px) {
			.blog-post .post-title {
				font-size: 30px;
			}
		}
		.blog-post .post-meta {
			display: block;
			text-transform: uppercase;
			letter-spacing: 1px;
			font-size: 16px;
			color: #b3b3b3;
			margin-bottom: 20px;
		}
		.blog-post .post-hero {
			width: 100%;
			border-radius: 8px;
			margin: 20px 0 40px;
		}
		.blog-post .back-link a:hover {
			color: #ff0080e6 !important;
			transition: all 0.3s ease;
		}

		/* Post body typography */
		.blog-post .post-body {
			font-size: 18px;
			line-height: 1.8;
		}
		.blog-post .post-body p {
			margin-bottom: 1.5em;
		}
		/* Links: same orange, pink on hover, as the rest of the site */
		.blog-post .post-body a,
		.blog-post .post-body a:visited {
			color: #ff9900;
			text-decoration: underline;
			transition: color 0.3s ease;
		}
		.blog-post .post-body a:hover,
		.blog-post .post-body a:focus,
		.blog-post .post-body a:visited:hover {
			color: #ff0080;
			text-decoration: underline;
		}
		.blog-post .post-body h2,
		.blog-post .post-body h3,
		.blog-post .post-body h4 {
			margin-top: 1.8em;
			margin-bottom: 0.6em;
		}
		.blog-post .post-body h2 { font-size: 28px; }
		.blog-post .post-body h3 { font-size: 24px; }
		.blog-post .post-body h4 { font-size: 20px; }
		.blog-post .post-body ul,
		.blog-post .post-body ol {
			margin-bottom: 1.5em;
			padding-left: 1.4em;
		}
		.blog-post .post-body li {
			margin-bottom: 0.5em;
		}
		.blog-post .post-body blockquote {
			border-left: 3px solid #ff0080e6;
			padding: 0.2em 0 0.2em 1.2em;
			margin: 2em 0;
			font-style: italic;
			color: #666;
		}
		.blog-post .post-body blockquote p:last-child {
			margin-bottom: 0;
		}
		.blog-post .post-body img {
			max-width: 100%;
			height: auto;
			border-radius: 8px;
		}
		.blog-post .post-body figure {
			margin: 2.5em 0;
			text-align: center;
		}
		.blog-post .post-body figure img {
			max-width: 70%;
		}
		@media (max-width: 768px) {
			.blog-post .post-body figure img {
				max-width: 100%;
			}
		}
		.blog-post .post-body figcaption {
			font-size: 15px;
			color: #999;
			margin-top: 0.8em;
			font-style: italic;
		}
		.blog-post .post-body pre,
		.blog-post .post-body code {
			background: #f7f7f7;
			border-radius: 4px;
		}
		.blog-post .post-body code {
			padding: 2px 5px;
			font-size: 15px;
		}
		.blog-post .post-body pre {
			padding: 1em 1.2em;
			overflow-x: auto;
		}
		.blog-post .post-body pre code {
			padding: 0;
			background: none;
		}
		.blog-post .post-body hr {
			border: none;
			border-top: 1px solid #e6e6e6;
			margin: 3em 0;
		}
		/* Typographic scene break (a line of *** in the markdown) */
		.blog-post .post-body .scene-break {
			text-align: center;
			letter-spacing: 0.8em;
			color: #b3b3b3;
			margin: 2.5em 0;
		}
		.blog-post .post-footer {
			margin-top: 4em;
			padding-top: 2em;
			border-top: 1px solid #e6e6e6;
		}
		.blog-post .post-footer a:hover {
			color: #ff0080e6 !important;
			transition: all 0.3s ease;
		}
	</style>
